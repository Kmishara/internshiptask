<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Job_01</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Navigation -->
    <nav class="bg-blue-600 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Job_01</h1>
            <button id="menuToggle" class="md:hidden text-white text-2xl">&#9776;</button>
            <div id="navLinks" class="hidden md:flex space-x-4">
                <a href="./index.html" class="px-4">Home</a>
                <a href="./jobs.html" class="px-4">Jobs</a>
                <a href="./employee.html" class="px-4">Employers</a>
                <a href="./blog.html" class="px-4 font-semibold">Blog</a>
                <a href="./contact.html" class="px-4">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="hidden bg-blue-700 text-white p-4 space-y-2 md:hidden">
        <a href="./index.html" class="block">Home</a>
        <a href="./jobs.html" class="block">Jobs</a>
        <a href="./employee.html" class="block">Employers</a>
        <a href="./blog.html" class="block font-semibold">Blog</a>
        <a href="./contact.html" class="block">Contact</a>
    </div>

    <!-- Hero Section -->
    <header class="bg-blue-500 text-white py-16 text-center px-6">
        <h2 class="text-4xl font-bold">Career Advice & Job Tips</h2>
        <p class="text-lg mt-2">Explore the latest career guides and job market insights.</p>
    </header>

    <!-- Blog Listing Section -->
    <section class="container mx-auto mt-10 p-6 bg-white shadow-md rounded-lg">
        <h3 class="text-2xl font-bold mb-4 text-center">Latest Blogs</h3>
        <div id="blogList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Blogs will be loaded dynamically -->
        </div>
    </section>

    <!-- Add New Blog Form -->
    <section class="container mx-auto mt-10 p-6 bg-white shadow-md rounded-lg">
        <h3 class="text-2xl font-bold mb-4 text-center">Submit a Blog</h3>
        <form id="blogForm" class="space-y-4">
            <input type="text" id="blogTitle" placeholder="Blog Title" class="border p-3 w-full rounded">
            <input type="text" id="blogAuthor" placeholder="Author Name" class="border p-3 w-full rounded">
            <textarea id="blogContent" placeholder="Blog Content" class="border p-3 w-full rounded"></textarea>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded w-full sm:w-auto">Submit Blog</button>
        </form>
        <p id="blogMessage" class="mt-2 text-green-500 hidden text-center">Blog submitted successfully!</p>
    </section>

    <script>
        // Toggle Mobile Menu
        document.getElementById("menuToggle").addEventListener("click", function () {
            document.getElementById("mobileMenu").classList.toggle("hidden");
        });

        // Dummy Blog Data
        const blogs = [
            { title: "How to Ace Your Next Job Interview", author: "John Doe", content: "Tips and tricks to prepare for interviews and impress hiring managers." },
            { title: "Top 10 Skills Employers Look For", author: "Jane Smith", content: "A guide to essential skills that can boost your chances of getting hired." },
            { title: "Resume Writing Tips for Freshers", author: "David Miller", content: "Step-by-step tips to craft an eye-catching resume for your first job." },
            { title: "Work From Home Productivity Hacks", author: "Sarah Johnson", content: "Effective ways to stay productive while working remotely." }
        ];

        // Load Blogs into Page
        function loadBlogs() {
            const blogList = document.getElementById("blogList");
            blogList.innerHTML = "";
            blogs.forEach(blog => {
                const blogCard = document.createElement("div");
                blogCard.classList = "p-4 bg-gray-100 shadow-md rounded text-center";
                blogCard.innerHTML = `
                    <h4 class="text-lg font-semibold">${blog.title}</h4>
                    <p class="text-gray-600">By ${blog.author}</p>
                    <p class="text-gray-500 mt-2">${blog.content}</p>
                `;
                blogList.appendChild(blogCard);
            });
        }
        loadBlogs();

        // Handle Blog Submission
        document.getElementById("blogForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const title = document.getElementById("blogTitle").value.trim();
            const author = document.getElementById("blogAuthor").value.trim();
            const content = document.getElementById("blogContent").value.trim();

            if (!title || !author || !content) {
                alert("Please fill all fields before submitting a blog.");
                return;
            }

            blogs.unshift({ title, author, content });
            loadBlogs();
            document.getElementById("blogMessage").classList.remove("hidden");
            this.reset();
        });
    </script>
</body>
</html>
